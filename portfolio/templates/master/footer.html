<footer class="footer py-4 bg-white">
  <div class="container d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
    <div>
      <div class="fw-bold text-dark">{{ profile.display_name|default:profile.full_name|default:'Portfolio' }}</div>
      <small>Modern portfolio, practical work, clean resume.</small>
    </div>
    <div class="d-flex flex-wrap gap-3">
      {% if profile.github %}
        <a href="{{ profile.github }}" target="_blank" rel="noreferrer" class="text-decoration-none">GitHub</a>
      {% endif %}
      {% if profile.linkedin %}
        <a href="{{ profile.linkedin }}" target="_blank" rel="noreferrer" class="text-decoration-none">LinkedIn</a>
      {% endif %}
      {% if profile.website %}
        <a href="{{ profile.website }}" target="_blank" rel="noreferrer" class="text-decoration-none">Website</a>
      {% endif %}
      {% if profile.email %}
        <a href="mailto:{{ profile.email }}" class="text-decoration-none">Email</a>
      {% endif %}
    </div>
  </div>
</footer>
