<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <title>User {{ action }}</title>
  </head>

  <body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: #f5f7fb; color: #162235;">
    <main class="bg-white border shadow-sm p-4 p-md-5 w-100 m-3" style="max-width: 430px; border-color: #e4e9f1 !important; border-radius: 8px;">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 44px; height: 44px; border-radius: 8px; background: #e8f5f2; color: #166a63;"><i class="fa-solid fa-file-lines"></i></div>
        <h1 class="h4 mb-2 text-capitalize">{{ action }} your workspace</h1>
        <p class="text-muted small mb-0">Your portfolio and resume, in one focused place.</p>
      </div>

      <form method="post">
        {% csrf_token %}
        {% include 'forms/form-core.html' %}

        <div class="d-grid">
          <button type="submit" class="btn w-100 text-capitalize" style="background: #166a63; border-color: #166a63; color: #fff;">{{ action }}</button>
        </div>

        <div class="text-center mt-3">
          {% if is_login %}
            <p class="mb-0 small">
              Don't have an account?
              <a href="{% url 'register' %}">Register</a>
            </p>
          {% else %}
            <p class="mb-0 small">
              Already have an account?
              <a href="{% url 'login' %}">Login</a>
            </p>
          {% endif %}
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
